 document.getElementById('design').innerHTML=variants[variant]().replaceAll(tr('Object A','Objeto A'),source==='video'?tr('Object A','Objeto A'):tr('Sheet 1','Hoja 1'));
 document.getElementById('video-source').setAttribute('aria-pressed',String(source==='video'));
 document.getElementById('independent-source').setAttribute('aria-pressed',String(source==='independent'));
 document.getElementById('source-detail').innerHTML=source==='video'?`<strong>${tr('Object A ▾','Objeto A ▾')}</strong><small>${tr('Read-only measurements · edit tracking in Tracker','Mediciones de solo lectura · edita en el rastreador')}</small>`:`<strong>${tr('Sheet 1','Hoja 1')}</strong><small>${tr('Type, paste or import data · no video needed','Escribe, pega o importa datos · sin video')}</small>`;
 document.querySelector('.integration-file').style.visibility=source==='video'?'hidden':'visible';

 document.querySelectorAll('[data-variant]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.variant===variant)));
 const url=new URL(location.href);url.searchParams.set('variant',variant);url.searchParams.set('lang',language);history.replaceState(null,'',url);
}
document.getElementById('video-source').onclick=()=>{source='video';render()};
document.getElementById('independent-source').onclick=()=>{source='independent';render()};
document.getElementById('language').onclick=()=>{language=language==='en'?'es':'en';render()};
render();
