<style>

*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,select{cursor:pointer}button{min-height:44px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);padding:8px 13px}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button[aria-pressed=true],.primary{background:var(--accent);color:white;border-color:var(--accent)}a{color:var(--accent)}.top{display:flex;align-items:center;gap:30px;background:var(--header);color:var(--headerText);padding:14px 26px;border-bottom:1px solid var(--border)}.logo{width:160px;height:auto}.top nav{display:flex;gap:5px;flex-wrap:wrap}.top nav button{background:transparent;color:inherit;border-color:transparent}.top nav button[aria-pressed=true]{background:var(--selected);color:var(--accent);border-color:var(--border)}.top .utility{margin-left:auto;display:flex;gap:9px}.utility button{background:transparent;color:inherit;border-color:currentColor;font-size:12px}.intro{max-width:1540px;margin:0 auto;padding:20px 26px 12px;display:flex;align-items:center;gap:20px}.intro h1{margin:0 0 5px;font-size:22px;font-weight:650;letter-spacing:-.5px}.intro p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.prototype-tag{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);font-weight:700;margin-bottom:6px}.swatches{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap}.swatch{font-size:10px;color:var(--muted);text-align:center}.swatch i{display:block;width:42px;height:24px;border:1px solid var(--border);border-radius:5px;margin-bottom:4px}.workspace{max-width:1540px;margin:auto;padding:12px 26px 20px}.workspace-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}.left{min-width:0}.card{background:var(--surface);border:1px solid var(--border);border-radius:11px;overflow:hidden}.card+.card{margin-top:16px}.heading{padding:17px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:15px}.heading h2{font-size:15px;margin:0}.heading small,.muted{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--soft);border-bottom:1px solid var(--border)}.toolbar button{font-size:12px}.toolbar .spacer{margin-left:auto}.toolbar small{color:var(--muted)}.inspector{position:sticky;top:12px}.tabs{display:flex;background:var(--soft);padding:5px;border-bottom:1px solid var(--border);gap:2px}.tabs button{flex:1;min-width:0;border:0;font-size:12px;padding:9px 5px;background:transparent}.tabs button[aria-pressed=true]{background:var(--surface);color:var(--accent);box-shadow:0 1px 4px #203b4e12}.panel{padding:20px}.panel h3{font-size:15px;margin:0 0 12px}.panel p{font-size:12px;line-height:1.7;color:var(--muted)}.field{display:block;font-size:12px;color:var(--muted);margin-bottom:15px}.value{display:block;margin-top:6px;border:1px solid var(--input);border-radius:6px;background:var(--surface);color:var(--text);padding:12px;font-size:13px;min-height:44px}.equation{background:var(--soft);border:1px solid var(--border);border-radius:7px;padding:16px;font:italic 22px Georgia,serif;margin:16px 0;color:var(--accent)}.standard{font:italic 19px Georgia,serif;color:var(--text);padding:6px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stats div{border-bottom:1px solid var(--border);padding:12px 0}.stats small{display:block;font-size:10px;color:var(--muted);margin-bottom:6px}.stats b{font-size:15px;font-weight:550}.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;min-height:44px}.switch{width:30px;height:18px;border-radius:12px;background:var(--accent);position:relative;flex-shrink:0}.switch:after{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:white;right:3px;top:3px}.divider{border:0;border-top:1px solid var(--border);margin:20px 0}.notice{background:var(--soft);border-left:3px solid var(--accent);padding:12px;font-size:12px;color:var(--muted);line-height:1.6}.chart{background:white;padding:15px 16px 8px}.chart svg{display:block;width:100%;max-height:370px}.chart-note{background:var(--surface);color:var(--muted);font-size:11px;padding:12px 20px;border-top:1px solid var(--border)}.legend{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;color:#45576a;font-size:11px;padding:8px 0 16px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#dc4848;margin-right:5px}.dash{display:inline-block;width:18px;border-top:2px dashed #64748b;margin-right:5px;vertical-align:middle}.line{display:inline-block;width:18px;border-top:2px solid #2563a6;margin-right:5px;vertical-align:middle}.results{display:grid;grid-template-columns:1.2fr 1fr 1fr;background:var(--band);color:var(--bandText);border-top:1px solid var(--border)}.results>div{padding:15px 20px;border-right:1px solid var(--border)}.results small{display:block;font-size:10px;margin-bottom:7px;opacity:.85}.results strong{font-size:17px;font-weight:550}.source-fields{display:flex;gap:14px;padding:15px 20px;flex-wrap:wrap}.source-fields .field{flex:1;min-width:100px;margin:0}.table-wrap{overflow:auto}.worksheet{border-collapse:collapse;table-layout:fixed;width:max-content;font-size:12px;font-variant-numeric:tabular-nums}.worksheet th,.worksheet td{width:104px;min-width:104px;max-width:104px;padding:12px 10px;text-align:right;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}.worksheet th{background:var(--soft);font-size:11px;color:var(--muted)}.worksheet th:first-child,.worksheet td:first-child{width:44px;min-width:44px;color:var(--muted);text-align:center}.worksheet tr.selected td{background:var(--selected)}.table-footer{display:flex;align-items:center;gap:15px;padding:10px 14px;font-size:11px;color:var(--muted)}.table-footer button{font-size:12px}.video{position:relative;background:#172331;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden}.video svg{width:100%;height:100%}.video-badge{position:absolute;top:16px;left:16px;color:#dce6ef;border:1px solid #61748a;background:#172331;padding:6px 10px;border-radius:5px;font-size:11px}.transport{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;background:var(--soft)}.transport button{min-width:44px}.transport .track{height:5px;flex:1;min-width:100px;background:var(--border);border-radius:5px}.transport .track:before{content:'';display:block;width:42%;height:100%;background:var(--accent)}.transport small{font-size:11px;color:var(--muted)}.objects{display:flex;gap:6px}.object{border-radius:5px;font-size:11px;padding:8px 12px;border:1px solid var(--border)}.object.a{background:#b73535;color:#fff;border-color:#b73535}.object.b{color:#205dae}.object.com{color:#7743a4}.range{height:6px;border-radius:5px;background:var(--border);margin:16px 0 25px}.range:before{content:'';display:block;width:55%;height:100%;background:var(--accent);border-radius:5px}.range:after{content:'';display:block;width:15px;height:15px;background:var(--accent);border:2px solid var(--surface);border-radius:50%;position:relative;left:53%;top:-10px}.status-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.status{font-size:10px;padding:6px 9px;border-radius:4px}.success{background:#e6f3eb;color:#246143}.warning{background:#fff1d7;color:#80531a}.danger{background:#fbe9e9;color:#993737}.comparison{max-width:1488px;margin:0 auto 24px;padding:18px 20px;border:1px solid var(--border);border-radius:10px;background:var(--surface);font-size:12px;line-height:1.7}.comparison strong{color:var(--accent)}.comparison p{margin:4px 0;color:var(--muted)}.sources{max-width:1488px;margin:0 auto 140px;padding:0 20px;font-size:11px;color:var(--muted);line-height:1.8}.switcher{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:6px;background:#172c41;color:#edf5fc;padding:7px;border-radius:12px;box-shadow:0 5px 24px #10283d40;max-width:calc(100vw - 20px)}.switcher button{background:transparent;color:#e3edf5;border:0;font-size:12px;white-space:nowrap}.switcher button[aria-pressed=true]{background:#dbeafb;color:#203e5d}.switcher .arrow{font-size:20px;padding:4px 10px}.switcher select{background:#172c41;color:#edf5fc;border:1px solid #60758b;border-radius:5px;min-height:44px;padding:6px;font-size:12px;max-width:140px}.bench-label{font-size:10px;padding:0 8px;max-width:110px;line-height:1.4}.modal{position:fixed;inset:0;background:#10243b80;display:grid;place-items:center;z-index:60;padding:20px}.dialog{background:var(--surface);border:1px solid var(--border);border-radius:15px;width:min(460px,100%);padding:26px;box-shadow:0 15px 65px #10243b40}.dialog .close{float:right}.dialog h2{font-size:22px;margin:8px 0 18px}.dialog p{font-size:13px;color:var(--muted);line-height:1.7}.dialog .full{display:block;width:100%;margin-top:12px}[hidden]{display:none!important}
@media(max-width:1000px){.workspace-grid{grid-template-columns:minmax(0,1fr) 285px;gap:12px}.workspace,.intro{padding-left:16px;padding-right:16px}.top{gap:16px;padding:12px 16px}.logo{width:140px}.results>div{padding:13px}.results strong{font-size:14px}.comparison{margin:0 16px 20px}.swatches{display:none}.panel{padding:16px}.top .utility .sample-label{display:none}}

/* Dark variants belong only to this visual test bench. */
button[aria-pressed=true],.primary{color:var(--buttonText,#fff)}
[data-mode=dark] .top nav button[aria-pressed=true],[data-mode=dark] .tabs button[aria-pressed=true]{color:var(--accent)}
[data-mode=dark] .chart{background:var(--surface)}
[data-mode=dark] .chart svg rect{fill:var(--surface)}
[data-mode=dark] .chart svg text{fill:var(--text)}
[data-mode=dark] .chart svg path[stroke="#dee5eb"]{stroke:var(--border)}
[data-mode=dark] .chart svg path[stroke="#66788b"]{stroke:var(--muted)}
[data-mode=dark] .chart svg path[stroke="#2563a6"]{stroke:#87bffc}
[data-mode=dark] .chart svg path[stroke="#64748b"]{stroke:#bac8db}
[data-mode=dark] .chart svg path[stroke="#b73535"]{stroke:#f29595}
[data-mode=dark] .chart svg circle{fill:#f08080}
[data-mode=dark] .legend{color:var(--muted)}
[data-mode=dark] .line{border-color:#87bffc}[data-mode=dark] .dash{border-color:#bac8db}[data-mode=dark] .dot{background:#f08080}
[data-mode=dark] .object.b{color:#99c2fa}[data-mode=dark] .object.com{color:#c4a5ed}
[data-mode=dark] .success{background:#203f34;color:#b1dfc5}[data-mode=dark] .warning{background:#443722;color:#efcd90}[data-mode=dark] .danger{background:#442b33;color:#efb2bc}
.switcher button[aria-pressed=true]{color:#203e5d}
.switcher{flex-wrap:wrap;justify-content:center;width:max-content}
</style></head><body>
<header class="top"><img class="logo" src="/logo-light.png" alt="PhysTracker" id="logo"><nav id="navigation" aria-label="Preview views"></nav><div class="utility"><button id="welcome"><span class="sample-label" id="welcome-label"></span> ◇</button><button id="language">Español</button></div></header>
<section class="intro"><div><div class="prototype-tag" id="tag"></div><h1 id="title"></h1><p id="subtitle"></p></div><div class="swatches" id="swatches"></div></section>
<main class="workspace" id="workspace"></main>
<section class="comparison" id="comparison" aria-live="polite"></section>
<footer class="sources" id="sources"></footer>
<nav class="switcher" aria-label="Palette comparison"><span class="bench-label" id="bench-label"></span><button class="arrow" id="previous" aria-label="Previous palette">‹</button><div id="palette-buttons" style="display:flex;gap:3px"></div><button class="arrow" id="next" aria-label="Next palette">›</button><select id="mode" aria-label="Light or dark preview"><option value="dark">Dark</option><option value="light">Light</option></select><select id="view" aria-label="Preview view"></select></nav>
<div class="modal" id="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" id="dialog"></section></div>
<script>
const params=new URLSearchParams(location.search);
let variant=['A','B','C','D','E','F','G'].includes(params.get('variant'))?params.get('variant'):'D';
let view=['tracker','analysis','independent'].includes(params.get('view'))?params.get('view'):'independent';
let language=params.get('lang')==='es'?'es':'en',tool='fit';
const tr=(en,es)=>language==='es'?es:en;
const palettes={
 A:{name:['Sky blue','Azul cielo'],description:['Recommended: light blue surfaces, white panels and a clear medium-blue action color. Closest to a calm, unified classroom app.','Recomendado: superficies azul claro, paneles blancos y acciones en azul medio. Una app educativa clara y uniforme.'],tokens:{bg:'#EDF5FC',surface:'#FFFFFF',soft:'#E4F0FB',text:'#253C50',muted:'#50697F',border:'#C5D9EA',input:'#8096AC',accent:'#24649E',selected:'#D7EAFB',header:'#FFFFFF',headerText:'#253C50',band:'#E4F0FB',bandText:'#253C50'}},
 B:{name:['Ice & ink','Hielo y tinta'],description:['More neutral: mostly white and pale blue-gray, with deeper blue controls. The graph and measurements receive the most attention.','Más neutro: blanco y gris azulado suave, con controles azul profundo. El gráfico y las mediciones reciben mayor atención.'],tokens:{bg:'#F3F6FA',surface:'#FFFFFF',soft:'#EDF2F8',text:'#26364B',muted:'#58677C',border:'#D2DCE9',input:'#8693A7',accent:'#355F91',selected:'#E1EAF7',header:'#FFFFFF',headerText:'#26364B',band:'#EDF2F8',bandText:'#26364B'}},
 C:{name:['Classic blue','Azul clásico'],description:['More familiar contrast: retain a navy header and results band, with light-blue work surfaces. Closest to the current darker identity.','Contraste más familiar: conserva cabecera y resultados azul marino, con superficies azul claro. Más cercano a la identidad oscura actual.'],tokens:{bg:'#EDF3F9',surface:'#FFFFFF',soft:'#E5EFF9',text:'#243A50',muted:'#4D657B',border:'#C9D8E7',input:'#7B93AC',accent:'#215F96',selected:'#DAEAF9',header:'#1B3046',headerText:'#E6EFF8',band:'#203D59',bandText:'#EDF5FD'}}
};
Object.assign(palettes,{
 D:{name:['Midnight blue','Azul medianoche'],description:['Recommended companion to Classic blue: layered navy surfaces, soft blue actions and cool readable text.','Complemento recomendado para Azul clásico: superficies marino, acciones azul suave y texto claro.'],tokens:{bg:'#101B2B',surface:'#192A3E',soft:'#22374F',text:'#E3EDF8',muted:'#ACBED1',border:'#3D526B',input:'#768BA4',accent:'#87BAF1',selected:'#284663',header:'#0D1725',headerText:'#E3EDF8',band:'#22374F',bandText:'#E3EDF8',buttonText:'#10243A'}},
 E:{name:['Slate blue','Azul pizarra'],description:['A softer, less blue alternative: charcoal-slate panels with restrained blue accents. Good for a quieter visual balance.','Una alternativa menos azul: paneles gris pizarra con acentos azules discretos. Un equilibrio visual más neutro.'],tokens:{bg:'#1B2029',surface:'#252D39',soft:'#303B4B',text:'#E6EBF3',muted:'#B4C0D0',border:'#4D5B70',input:'#8494AA',accent:'#AAC5EC',selected:'#354A66',header:'#161C25',headerText:'#E6EBF3',band:'#303B4B',bandText:'#E6EBF3',buttonText:'#1C2A40'}},
 F:{name:['Deep ocean','Océano profundo'],description:['The darkest option: deep blue surfaces with brighter icy-blue accents. More contrast and a stronger nighttime identity.','La opción más oscura: superficies azul profundo con acentos azul hielo. Más contraste y una identidad nocturna marcada.'],tokens:{bg:'#08131D',surface:'#102433',soft:'#193446',text:'#E1EEF7',muted:'#A7C0D1',border:'#365468',input:'#708FA5',accent:'#7FC9F5',selected:'#214861',header:'#060F18',headerText:'#E1EEF7',band:'#193446',bandText:'#E1EEF7',buttonText:'#082437'}}
});
palettes.G={name:['Light graph workspace','Gráficos claros'],description:['Preview: Midnight blue navigation with a fully light graph, worksheet and settings area. The Tracker stays dark.','Vista previa: navegación Azul medianoche con gráfico, tabla y ajustes claros. El rastreador permanece oscuro.'],tokens:{...palettes.C.tokens,header:'#0D1725',headerText:'#E3EDF8',band:'#E5EFF9',bandText:'#243A50'}};
const dark=()=>['D','E','F'].includes(variant)||(variant==='G'&&view==='tracker');
const group=()=>variant==='G'?['D','G']:dark()?['D','E','F','G']:['A','B','C'];
const views={tracker:['Tracker','Rastreador'],analysis:['Video analysis','Análisis de video'],independent:['Independent worksheet','Hoja independiente']};
const field=(name,value)=>`<label class="field">${name}<span class="value">${value}</span></label>`;
const mockButton=(text,primary=false)=>`<button type="button" tabindex="-1" aria-disabled="true" class="${primary?'primary':''}">${text}</button>`;
const table=()=>`<div class="table-wrap"><table class="worksheet"><thead><tr><th>#</th><th>X / s</th><th>Y / m</th><th>±ΔX / s</th><th>±ΔY / m</th></tr></thead><tbody>${Array.from({length:6},(_,i)=>`<tr class="${i===2?'selected':''}"><td>${i+1}</td><td>${i.toFixed(2)}</td><td>${(.4+1.2*i).toFixed(2)}</td><td>0.02</td><td>0.30</td></tr>`).join('')}</tbody></table></div>`;
const chart=()=>`<div class="chart"><svg viewBox="0 0 760 370" role="img" aria-label="${tr('Illustrative position versus time graph','Gráfico ilustrativo de posición frente a tiempo')}"><rect width="760" height="370" fill="white"/><text x="395" y="25" text-anchor="middle" font-size="17" fill="#243746">${tr('Position vs time','Posición frente al tiempo')}</text>${Array.from({length:6},(_,i)=>`<path d="M${75+i*126} 50V305" stroke="#dee5eb"/><text x="${75+i*126}" y="327" text-anchor="middle" fill="#526575" font-size="12">${i}</text>`).join('')}${Array.from({length:5},(_,i)=>`<path d="M75 ${305-i*60}H705" stroke="#dee5eb"/><text x="60" y="${309-i*60}" text-anchor="end" fill="#526575" font-size="12">${i*2}</text>`).join('')}<path d="M75 50V305H705" fill="none" stroke="#66788b"/><path d="M75 293L705 113" stroke="#2563a6" stroke-width="2.5"/><path d="M75 284L705 122M75 302L705 104" stroke="#64748b" stroke-dasharray="5 5" fill="none"/>${Array.from({length:6},(_,i)=>{const x=75+i*126,y=293-i*36;return `<path d="M${x} ${y-9}V${y+9}M${x-5} ${y-9}H${x+5}M${x-5} ${y+9}H${x+5}" stroke="#b73535"/><circle cx="${x}" cy="${y}" r="4" fill="#dc4848"/>`;}).join('')}<text x="390" y="357" text-anchor="middle" fill="#243746" font-size="14">${tr('Time (s)','Tiempo (s)')}</text><text x="23" y="180" text-anchor="middle" transform="rotate(-90 23 180)" fill="#243746" font-size="14">${tr('Position (m)','Posición (m)')}</text></svg><div class="legend"><span><i class="dot"></i>${tr('Measurements','Mediciones')}</span><span><i class="line"></i>${tr('Best fit','Mejor ajuste')}</span><span><i class="dash"></i>${tr('Worst-fit bounds','Límites del peor ajuste')}</span></div></div>`;
const results=()=>`<div class="results"><div><small>${tr('RELATIONSHIP','RELACIÓN')}</small><strong>y = 1.20x + 0.40</strong></div><div><small>${tr('GRADIENT','PENDIENTE')}</small><strong>1.20 ± 0.12 m/s</strong></div><div><small>R²</small><strong>1.000</strong></div></div>`;
const fitPanel=()=>`<h3>${tr('Fit the relationship','Ajustar la relación')}</h3>${field(tr('Model','Modelo'),tr('Linear','Lineal')+' ⌄')}<div class="standard">y = Ax + B</div><div class="equation">y = 1.20x + 0.40</div><div class="stats"><div><small>${tr('Gradient A','Pendiente A')}</small><b>1.20 m/s</b></div><div><small>${tr('Intercept B','Intercepto B')}</small><b>0.40 m</b></div></div><hr class="divider"><h3>${tr('Worst acceptable fit','Peor ajuste aceptable')}</h3><div class="toggle">${tr('Show maximum / minimum','Mostrar máxima / mínima')}<span class="switch"></span></div>${field('±ΔX','0.02 s')}${field('±ΔY','0.30 m')}<p>${tr('Illustrative values. In the app, bounds are calculated from your uncertainty regions.','Valores ilustrativos. En la app, los límites se calculan a partir de tus regiones de incertidumbre.')}</p>`;
const inspector=()=>`<aside class="card inspector"><div class="tabs">${['fit','appearance','export','data'].map(k=>`<button data-tool="${k}" aria-pressed="${tool===k}">${({fit:tr('Fit','Ajuste'),appearance:tr('Appearance','Aspecto'),export:tr('Export','Exportar'),data:tr('Data','Datos')})[k]}</button>`).join('')}</div><div class="panel">${tool==='fit'?fitPanel():tool==='appearance'?`<h3>${tr('Figure appearance','Aspecto de la figura')}</h3>${field(tr('Figure title','Título'),'Position vs time')}${field(tr('X label','Etiqueta X'),tr('Time (s)','Tiempo (s)'))}${field(tr('Y label','Etiqueta Y'),tr('Position (m)','Posición (m)'))}<div class="toggle">${tr('Grid','Cuadrícula')}<span class="switch"></span></div><div class="toggle">${tr('Error bars','Barras de error')}<span class="switch"></span></div><p>${tr('Graph previews follow the app theme; exported figures would retain white paper.','La vista del gráfico sigue el tema; las exportaciones conservarían papel blanco.')}</p>`:tool==='export'?`<h3>${tr('Export figure','Exportar figura')}</h3>${field(tr('Paper size','Tamaño'),'20 × 13 cm')}${field(tr('Resolution','Resolución'),'300 dpi')}<div style="display:grid;gap:10px">${mockButton('PNG',true)}${mockButton('SVG')}${mockButton('PDF')}${mockButton(tr('Export data (CSV)','Exportar datos (CSV)'))}</div><p>${tr('Visual examples only; these buttons do not download files.','Solo ejemplos visuales; estos botones no descargan archivos.')}</p>`:`<h3>${tr('Data source','Fuente de datos')}</h3><p>${tr('The compact table contains X, Y and absolute uncertainties ±ΔX and ±ΔY.','La tabla compacta contiene X, Y e incertidumbres absolutas ±ΔX y ±ΔY.')}</p>${field(tr('X label','Etiqueta X'),tr('Time','Tiempo'))}${field(tr('Y label','Etiqueta Y'),tr('Position','Posición'))}<div class="notice">${tr('Sample data for visual comparison. Your real data is not loaded here.','Datos de ejemplo para comparar el diseño. Aquí no se cargan tus datos reales.')}</div>`}</div></aside>`;
function graphView(){return `<div class="workspace-grid"><div class="left"><section class="card"><div class="source-fields">${field(tr('X label','Etiqueta X'),tr('Time / s','Tiempo / s'))}${field(tr('Y label','Etiqueta Y'),tr('Position / m','Posición / m'))}${field(tr('Data source','Fuente de datos'),view==='analysis'?tr('Object A','Objeto A'):tr('Independent worksheet','Hoja independiente'))}</div></section><section class="card"><div class="heading"><h2>${tr('Position vs time','Posición frente al tiempo')}</h2><small>6 ${tr('points','puntos')}</small></div><div class="toolbar">${mockButton(tr('Zoom','Ampliar'))}${mockButton(tr('Pan','Mover'))}<span class="spacer"></span>${mockButton(tr('Reset view','Restablecer vista'))}</div>${chart()}${results()}</section>${view==='independent'?`<section class="card"><div class="heading"><h2>${tr('Worksheet','Hoja de datos')}</h2><small>${tr('Compact numeric columns','Columnas numéricas compactas')}</small></div>${table()}<div class="table-footer">${mockButton(tr('+ Add row','+ Añadir fila'))}<span>6 ${tr('rows','filas')} · ±ΔX / ±ΔY</span></div></section>`:''}</div>${inspector()}</div>`;}
function trackerView(){return `<div class="workspace-grid"><div class="left"><section class="card"><div class="toolbar"><div class="objects"><span class="object a">${tr('Object A','Objeto A')}</span><span class="object b">B</span><span class="object com">COM</span></div><span class="spacer"></span>${mockButton(tr('Scale ✓','Escala ✓'))}${mockButton(tr('Axes ✓','Ejes ✓'))}${mockButton(tr('Tracking ▾','Seguimiento ▾'))}</div><div class="video"><span class="video-badge">${tr('Illustrative video frame · 00:00.40','Fotograma ilustrativo · 00:00.40')}</span><svg viewBox="0 0 850 478" aria-label="${tr('Illustrative motion tracking canvas','Lienzo ilustrativo de seguimiento')}"><rect width="850" height="478" fill="#172331"/><path d="M0 385H850" stroke="#526276" stroke-width="3"/><path d="M100 385H760M100 405V90" stroke="#84c7f5" stroke-width="1.5"/><text x="770" y="389" fill="#b3daef" font-size="16">x</text><text x="94" y="80" fill="#b3daef" font-size="16">y</text><path d="M145 345Q380 30 690 280" stroke="#f28181" stroke-dasharray="4 9" fill="none" opacity=".7"/>${[[145,345],[215,270],[290,215],[370,184],[450,180]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4" fill="#f06464"/>`).join('')}<circle cx="450" cy="180" r="19" fill="#e7ad53"/><circle cx="450" cy="180" r="33" fill="none" stroke="#7fc9fa" stroke-width="2"/><path d="M408 180H492M450 138V222" stroke="#fff" stroke-width="1"/><path d="M560 370H710M560 364V376M710 364V376" stroke="#dce9ef" stroke-width="2"/><text x="635" y="357" text-anchor="middle" fill="#dce9ef" font-size="14">1.00 m</text></svg></div><div class="transport">${mockButton('‹')}${mockButton('▶',true)}${mockButton('›')}<small>00:00.40</small><span class="track"></span><small>00:01.20</small>${mockButton(tr('Fit video','Ajustar video'))}</div></section><div class="status-row"><span class="status success">✓ ${tr('Calibrated','Calibrado')}</span><span class="status warning">${tr('Review tracking points','Revisar puntos')}</span><span class="status danger">${tr('Lost target · sample status','Objeto perdido · estado de ejemplo')}</span></div></div><aside class="card inspector"><div class="tabs"><button aria-pressed="true" tabindex="-1">${tr('Controls','Controles')}</button><button tabindex="-1">${tr('Data','Datos')}</button><button tabindex="-1">${tr('Tools','Herramientas')}</button></div><div class="panel"><h3>${tr('Automatic tracking','Seguimiento automático')}</h3><p>${tr('Select the object in the video, then adjust its template.','Selecciona el objeto en el video y ajusta su plantilla.')}</p><div class="notice">${tr('Object A selected. The original red, blue and purple object identities stay consistent.','Objeto A seleccionado. Se conservan las identidades roja, azul y violeta de los objetos.')}</div><hr class="divider"><div class="toggle">${tr('Template diameter','Diámetro de plantilla')}<b>40 px</b></div><div class="range"></div><div class="toggle">${tr('Search radius','Radio de búsqueda')}<b>80 px</b></div><div class="range"></div>${mockButton(tr('Start tracking','Iniciar seguimiento'),true)}<hr class="divider"><h3>${tr('Latest measurements','Últimas mediciones')}</h3>${table()}</div></aside></div>`;}
function luminance(hex){const rgb=hex.slice(1).match(/../g).map(h=>parseInt(h,16)/255).map(n=>n<=.04045?n/12.92:((n+.055)/1.055)**2.4);return rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722;}
function contrast(a,b){const v=[luminance(a),luminance(b)].sort((x,y)=>x-y);return ((v[1]+.05)/(v[0]+.05)).toFixed(2);}
function updateURL(){const p=new URLSearchParams({variant,view,lang:language});history.replaceState(null,'','?'+p);}
function render(){const p=variant==='G'&&view==='tracker'?palettes.D:palettes[variant],es=language==='es';document.documentElement.lang=language;document.documentElement.dataset.mode=dark()?'dark':'light';document.documentElement.style.setProperty('--buttonText',p.tokens.buttonText||'#FFFFFF');document.documentElement.style.colorScheme=dark()?'dark':'light';Object.entries(p.tokens).forEach(([k,v])=>document.documentElement.style.setProperty('--'+k,v));document.getElementById('logo').src=(variant==='C'||variant==='G'||dark())?'/logo-dark.png':'/logo-light.png';document.getElementById('navigation').innerHTML=Object.entries(views).map(([k,n])=>`<button data-view="${k}" aria-pressed="${view===k}">${n[es?1:0]}</button>`).join('');document.getElementById('welcome-label').textContent=tr('Welcome dialog','Bienvenida');document.getElementById('welcome').ariaLabel=tr('Preview welcome dialog','Ver diálogo de bienvenida');document.getElementById('language').textContent=es?'English':'Español';document.getElementById('tag').textContent=tr('COLOR TEST BENCH · VISUAL PROTOTYPE','BANCO DE COLORES · PROTOTIPO VISUAL');document.getElementById('title').textContent=variant+' — '+p.name[es?1:0];document.getElementById('subtitle').textContent=p.description[es?1:0];document.getElementById('swatches').innerHTML=['bg','soft','accent','text'].map(k=>`<span class="swatch"><i style="background:${p.tokens[k]}"></i>${p.tokens[k]}</span>`).join('');document.getElementById('workspace').innerHTML=view==='tracker'?trackerView():graphView();document.getElementById('comparison').innerHTML=`<strong>${tr('A whole-app palette, not only a graph style.','Una paleta para toda la app, no solo para el gráfico.')}</strong><p>${tr('Backgrounds, panels, active controls, fields and dialogs change together. Classic blue is the selected light-mode direction. Logo and object/status identities are retained. Dark views preview a dark graph canvas; exported figures would keep white paper. Green appears only for successful status, not as an interface accent.','Fondos, paneles, controles activos, campos y diálogos cambian juntos. Azul clásico es la opción elegida para el modo claro. Se conservan logo e identidades de objetos y estados. Las vistas oscuras muestran un lienzo oscuro; las exportaciones conservarían papel blanco. El verde solo indica un estado correcto, no es un acento de la interfaz.')}</p><p>${tr('Calculated contrast','Contraste calculado')}: ${tr('main text','texto principal')} ${contrast(p.tokens.text,p.tokens.surface)}:1 · ${tr('secondary text','texto secundario')} ${contrast(p.tokens.muted,p.tokens.surface)}:1 · ${tr('primary button','botón principal')} ${contrast(p.tokens.buttonText||'#FFFFFF',p.tokens.accent)}:1. ${tr('Selected text pairs only; not a full accessibility audit.','Solo pares seleccionados; no es una auditoría completa de accesibilidad.')}</p>`;if(variant==='G')document.getElementById('comparison').innerHTML=`<strong>${tr('Proposed combination: dark navigation + light graphing workspace.','Combinación propuesta: navegación oscura + espacio de gráficos claro.')}</strong><p>${tr('The graph, worksheet and inspector form one light workspace. Classic blue buttons and pale blue-gray borders tie it to the navy header. Switch to Tracker to see the dark canvas and controls retained. Use Midnight blue below to compare with fully dark graphing. Preview only; the working app is unchanged.','Gráfico, tabla y ajustes forman un espacio claro. Botones azul clásico y bordes gris azulado lo conectan con la cabecera marino. Cambia a Rastreador para ver su lienzo y controles oscuros. Usa Azul medianoche abajo para comparar. Solo vista previa; la app no cambia.')}</p>`;document.getElementById('sources').innerHTML=`${tr('Preview only: sample data and illustrative screens. Use the palette arrows, screen selector, tool tabs and welcome dialog. Tracking, editing and exporting are not active. No changes are made to your app or files.','Solo vista previa: datos y pantallas ilustrativos. Usa flechas de paleta, selector de pantalla, pestañas y diálogo de bienvenida. Seguimiento, edición y exportación están inactivos. No se modifica tu app ni tus archivos.')}<br>${tr('Design references','Referencias')}: <a href="https://muffingroup.com/blog/calm-color-palette/" target="_blank" rel="noopener">MuffinGroup</a> · <a href="https://color-analysis.app/blog/calming-color-palette-psychology" target="_blank" rel="noopener">Color Analysis</a>. ${tr('Soft surfaces and readable text are the goal; no psychological benefit is assumed.','El objetivo es suavidad y legibilidad; no se presume un beneficio psicológico.')}`;document.getElementById('palette-buttons').innerHTML=Object.entries(palettes).filter(([k])=>group().includes(k)).map(([k,v])=>`<button data-palette="${k}" aria-pressed="${variant===k}">${k} · ${v.name[es?1:0]}</button>`).join('');document.getElementById('mode').innerHTML=`<option value="dark" ${dark()&&variant!=='G'?'selected':''}>${tr('Dark mode','Modo oscuro')}</option><option value="light" ${!dark()&&variant!=='G'?'selected':''}>${tr('Light mode','Modo claro')}</option><option value="hybrid" ${variant==='G'?'selected':''}>${tr('Dark shell / light graphs','App oscura / gráficos claros')}</option>`;document.getElementById('view').innerHTML=Object.entries(views).map(([k,v])=>`<option value="${k}" ${view===k?'selected':''}>${v[es?1:0]}</option>`).join('');document.getElementById('bench-label').textContent=tr('COMPARE PALETTES','COMPARAR PALETAS');document.getElementById('previous').ariaLabel=tr('Previous palette','Paleta anterior');document.getElementById('next').ariaLabel=tr('Next palette','Paleta siguiente');updateURL();}
function cycle(delta){const keys=group();variant=keys[(keys.indexOf(variant)+delta+keys.length)%keys.length];render();}
document.addEventListener('click',event=>{const p=event.target.closest('[data-palette]'),v=event.target.closest('[data-view]'),t=event.target.closest('[data-tool]');if(p){variant=p.dataset.palette;render();}if(v){view=v.dataset.view;render();}if(t){tool=t.dataset.tool;render();document.querySelector(`[data-tool="${tool}"]`)?.focus();}});
document.getElementById('mode').onchange=e=>{variant=e.target.value==='hybrid'?'G':e.target.value==='dark'?'D':'C';render();};document.getElementById('previous').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.getElementById('view').onchange=e=>{view=e.target.value;render();};document.getElementById('language').onclick=()=>{language=language==='en'?'es':'en';render();};
const modal=document.getElementById('modal');
function closeDialog(){modal.hidden=true;document.getElementById('welcome').focus();}
document.getElementById('welcome').onclick=()=>{document.getElementById('dialog').innerHTML=`<button class="close" id="close-dialog" aria-label="${tr('Close dialog','Cerrar diálogo')}">×</button><div class="prototype-tag">${tr('SAMPLE DIALOG','DIÁLOGO DE EJEMPLO')}</div><h2 id="dialog-title">${tr('Start an experiment','Inicia un experimento')}</h2><p>${tr('Track motion in a video, or work directly with your own measurements.','Estudia el movimiento de un video o trabaja con tus propias mediciones.')}</p>${mockButton(tr('Open video or image','Abrir video o imagen'),true)}<p class="notice">${tr('Visual example only. No file will be opened.','Solo ejemplo visual. No se abrirá ningún archivo.')}</p><button class="full" id="dismiss-dialog">${tr('Back to preview','Volver a la vista previa')}</button>`;modal.hidden=false;document.getElementById('close-dialog').onclick=closeDialog;document.getElementById('dismiss-dialog').onclick=closeDialog;document.getElementById('close-dialog').focus();};
document.addEventListener('keydown',e=>{if(!modal.hidden){if(e.key==='Escape')closeDialog();if(e.key==='Tab'){const first=document.getElementById('close-dialog'),last=document.getElementById('dismiss-dialog');if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(e.target.closest('input,select,textarea,button,a'))return;if(e.key==='ArrowLeft'){e.preventDefault();cycle(-1);}if(e.key==='ArrowRight'){e.preventDefault();cycle(1);}});
render();
</script></body></html>
